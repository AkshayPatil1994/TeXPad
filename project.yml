name: TexPad
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
options:
  bundleIdPrefix: com.akshay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
targets:
  TexPad:
    type: application
    platform: iOS
    sources:
      - path: TexPad
        excludes:
          - "web/**"
      - path: TexPad/web
        type: folder
        buildPhase: resources
      - path: Samples
        type: folder
        buildPhase: resources
      - path: fonts
        type: folder
        buildPhase: resources
        optional: true
      - path: texlive
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.texpad
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: TexPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TexPad
  TexPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TexPadTests
    dependencies:
      - target: TexPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.texpad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TexPad:
    build:
      targets:
        TexPad: all
    test:
      targets:
        - TexPadTests
